name: Deploy web (Vercel)

# Auto-deploys the Next.js frontend (apps/web) to the Vercel "web" project on
# every push to main that touches the app. Replicates the proven CLI flow
# (run from apps/web with the project's Root Directory cleared), which avoids
# the monorepo conflict between the repo-root vercel.json (Python API) and the
# web project's Next.js build. The API project keeps deploying via Vercel's
# native Git integration.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_mqbwnqS0yw7x0VAIcapSfuja
      VERCEL_PROJECT_ID: prj_dasmvDScEult2hbHRHcoRfYkpqSN
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Remote build (matches the working `vercel --prod` flow). The prebuilt
      # path (`vercel build` + `vercel deploy --prebuilt`) was rejected by
      # Vercel with a BLOCKED state, so build on Vercel instead.
      - name: Deploy to production
        run: vercel deploy --prod --token="$VERCEL_TOKEN"
